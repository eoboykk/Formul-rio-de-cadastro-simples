<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Formulário Simples</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <form action="#" method="post">
            <h1>Cadastro</h1>

            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Seu nome completo">

            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" name="cidade">

            <label for="cargo">Cargo Pretendido</label>
            <select id="cargo" name="cargo">
                <option value="adm">Administrativo</option>
                <option value="fin">Financeiro</option>
                <option value="Rec">Recepção</option>
                 <option value="Adm">Administrativo</option>
                  <option value="Jur">Juridico</option>
                  <label for="cargo">Cargo Pretendido</label> 
                 </select>
                 <label for="area">Área de interesse</label>
            <select id="interesse" name="Área de Interesse">
                <option value="com">Computação</option>
                <option value="fin">Financeiro</option>
                <option value="eng">Engenharia</option>
                <option value="his">historia</option>
                 <option value="bio">Biologia </option>
                  <option value="mei">Meio Ambiente</option>
            </select>
            <label for="estado"> Estado</label>
            <select id="estado" name="estado">
    <option value="AC">Acre</option>
    <option value="AL">Alagoas</option>
    <option value="AP">Amapá</option>
    <option value="AM">Amazonas</option>
    <option value="BA">Bahia</option>
    <option value="CE">Ceará</option>
    <option value="DF">Distrito Federal</option>
    <option value="ES">Espírito Santo</option>
    <option value="GO">Goiás</option>
    <option value="MA">Maranhão</option>
    <option value="MT">Mato Grosso</option>
    <option value="MS">Mato Grosso do Sul</option>
    <option value="MG">Minas Gerais</option>
    <option value="PA">Pará</option>
    <option value="PB">Paraíba</option>
    <option value="PR">Paraná</option>
    <option value="PE">Pernambuco</option>
    <option value="PI">Piauí</option>
    <option value="RJ">Rio de Janeiro</option>
    <option value="RN">Rio Grande do Norte</option>
    <option value="RS">Rio Grande do Sul</option>
    <option value="RO">Rondônia</option>
    <option value="RR">Roraima</option>
    <option value="SC">Santa Catarina</option>
    <option value="SP">São Paulo</option>
    <option value="SE">Sergipe</option>
    <option value="TO">Tocantins</option>
    <option value="EX">Estrangeiro</option>
</select>
            <label for="resumo">Mini Currículo</label>
            <textarea id="resumo" name="resumo" rows="4"></textarea>

            <button type="submit">Enviar</button>
        </form>
    </div>

</body>
</html>

<button type="button">Clique Aqui</button>
