<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro De Estudante</title>
    <link rel="logo" href="logo.png" type="image/png">
    <style>
        /* Estilos gerais */
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            color: black;
            margin: 20px;
        }

        /* Estilos para títulos */
        h1 {
            color: rgb(20, 25, 27);
            font-family: verdana;
            font-size: 300%;
            text-align: center;
        }

        h2 {
            text-align: center;
        }

        /* Estilos para formulários */
        form {
            max-width: 500px;
            margin: auto;
        }

        label {
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 6px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        button {
            width: 100%;
            padding: 8px;
            background-color: black;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }

        /* Estilos para mensagens */
        #mensagem {
            text-align: center;
            color: green;
            font-weight: bold;
            display: none;
            margin-top: 10px;
        }

        /* Estilos para rodapé */
        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 14px;
            color: #555;
        }

        /* Imagem do topo */
        .logo {
            display: block;
            margin: auto;
            width: 180px;
            height: 180px;
        }
    </style>
</head>
<body>
    <img src="logo.png" alt="Logotipo Simples" class="logo">
    <h1>EMPRESA</h1>
    <p style="text-align: center;">Ficha de Cadastro</p>
    <h2>Insira seus Dados</h2>
    <form action="/action_page.php">
        <label for="fname">Primeiro Nome:</label>
         <input type="text" id="fname" name="fname" placeholder="Seu Nome">
        <label for="lname">Sobrenome:</label>
         <input type="text" id="lname" name="lname" placeholder="Seu Sobrenome">
        <label for="cpf">CPF:</label>
         <input type="text" id="cpf" name="cpf" placeholder="Insira um CPF válido">
        <label for="cep">CEP:</label>
         <input type="text" id="RG" name="RG" placeholder="Insira um CEP válido">
        <label for="RG">RG:</label>
         <input type="text" id="data" name="RGl" placeholder="Insira seu RG">
          <label for="data">Email:</label>
          <input type="text" id="email" name="email" placeholder="Insira seu email">
          <label for="data">Data de nascimento:</label>
         <input type="text" id="data" name="data de nascimento" placeholder="Insira sua data de nascimento">
        <label for="sexo">Sexo:</label> 

        <select name="sexo" id="sexo">
            <option value="">--Selecione--</option>
            <option value="masculino">Masculino</option>
            <option value="feminino">Feminino</option>
            <option value="outros">Outros</option>
        </select>
        <label for="estado">Estado:</label>
        <select name="estado" id="estado">
            <option value="">--Selecione--</option>
            <option value="AC">Acre</option>
            <option value="AL">Alagoas</option>
            <option value="AP">Amapá</option>
            <option value="AM">Amazonas</option>
            <option value="BA">Bahia</option>
            <option value="CE">Ceará</option>
            <option value="DF">Distrito Federal</option>
            <option value="ES">Espírito Santo</option>
            <option value="GO">Goiás</option>
            <option value="MA">Maranhão</option>
            <option value="MT">Mato Grosso</option>
            <option value="MS">Mato Grosso do Sul</option>
            <option value="MG">Minas Gerais</option>
            <option value="PA">Pará</option>
            <option value="PB">Paraíba</option>
            <option value="PR">Paraná</option>
            <option value="PE">Pernambuco</option>
            <option value="PI">Piauí</option>
            <option value="RJ">Rio de Janeiro</option>
            <option value="RN">Rio Grande do Norte</option>
            <option value="RS">Rio Grande do Sul</option>
            <option value="RO">Rondônia</option>
            <option value="RR">Roraima</option>
            <option value="SC">Santa Catarina</option>
            <option value="SP">São Paulo</option>
            <option value="SE">Sergipe</option>
            <option value="TO">Tocantins</option>
        </select>
        <label for="turma"> Contato:</label>
        <input type="text" id="turma" name="turma" placeholder="informe seu contato">
        <button type="submit">Cadastrar</button>
        <div id="mensagem">Cadastro realizado com sucesso!</div>
    </form>
    <footer>&copy; 2026 EEEFM Almirante Barroso 3v2 RED Ramon M.</footer>
</body>
</html>
